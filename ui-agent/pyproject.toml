[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-agent"
version = "0.1.0"
description = "A locally hosted 'Computer Use' / UI Automation Agent CLI powered by Gemini 1.5 Flash Vision."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.1",
    "google-generativeai>=0.4.0",
    "rich>=13.0.0",
    "pynput>=1.7.6"
]

[project.scripts]
ui-agent = "ui_agent.main:cli"
